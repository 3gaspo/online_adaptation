[project]
name = "online-forecast-adaptation"
version = "0.1.0"
description = "Causal rolling retrieval and online adaptation of frozen time-series forecasters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "chronos-forecasting==2.0.1",
    "einops>=0.8.2",
    "faiss-cpu>=1.9.0,<2",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.19.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "tabpfn==6.3.1",
    "tirex-2==0.2.1",
    "torch>=2.8.0,<2.10",
    "tsicl==0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"src.conf" = ["*.yaml"]
