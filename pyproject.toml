[project]
name = "online-forecast-adaptation"
version = "0.1.0"
description = "Causal rolling retrieval and online adaptation of frozen time-series forecasters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "chronos-forecasting>=2.3.1",
    "einops>=0.8.2",
    "faiss-cpu>=1.15.0",
    "huggingface-hub>=1.27.0",
    "hydra-core>=1.3.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "torch==2.5.1",
    "tsicl>=0.2.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"src.conf" = ["*.yaml"]
